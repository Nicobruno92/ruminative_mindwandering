[pytest]
# =============================================================================
# LOSO Pipeline Test Configuration
# =============================================================================
# Saves test results:
#   - HTML report: tests/results/report.html  (browsable, with pass/fail per test)
#   - JUnit XML:   tests/results/junit.xml    (CI-compatible)
# =============================================================================
testpaths = tests
addopts =
    -v
    --tb=short
    --html=tests/results/report.html
    --self-contained-html
    --junit-xml=tests/results/junit.xml

# Display: show test names even for pass/fail (no -q)
log_cli = false
