random_seed: 42
rf_bootstrap: true
rf_class_weight: balanced_subsample
rf_max_depth: 8
rf_max_features: sqrt
rf_min_samples_leaf: 5
rf_min_samples_split: 10
rf_n_estimators: 200
rf_n_jobs: 1
run_contrasts:
- valence_sq
- time_sq
run_families:
- all
save_csv: true
save_pickle: false
save_plots: true
save_probabilities: true
save_shap: true
scale_by_participant: within
scaler: standard
scoring_metrics:
- auc
- balanced_accuracy
- auprc
- mcc
slurm:
