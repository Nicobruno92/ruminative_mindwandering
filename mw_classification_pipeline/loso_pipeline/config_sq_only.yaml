data_format: per_roi
data_paths:
  features_root: /network/iss/cenir/analyse/meeg/CYBERSART/BIDS/features
  results_root: results/MW_Classification
exclude_column_suffixes:
- _std
feature_families:
  all:
    epoch_types:
    - sleep
    - evoked
    prefixes:
    - N1
    - P1
    - P3a
    - P3b
    - PE_theta
    - PE_alpha
    - PE_beta
    - PE_gamma
    - kolmogorov_complexity
    - psd_relative_delta
    - psd_relative_theta
    - psd_relative_alpha
    - psd_relative_beta
    - psd_relative_gamma
    - wsmi_theta
    - wsmi_alpha
    - wsmi_beta
    - wsmi_gamma
    - slowwaves
  connectivity:
    epoch_types:
    - sleep
    prefixes:
    - wsmi_theta
    - wsmi_alpha
    - wsmi_beta
    - wsmi_gamma
  erp:
    epoch_types:
    - evoked
    prefixes:
    - P1
    - N1
    - P3a
    - P3b
  information_theory:
    epoch_types:
    - sleep
    prefixes:
    - PE_theta
    - PE_alpha
    - PE_beta
    - PE_gamma
    - kolmogorov_complexity
  sleep:
    epoch_types:
    - sleep
    prefixes:
    - slowwaves
    - spindles
  spectral:
    epoch_types:
    - sleep
    prefixes:
    - power_normalized
# Disabled to match loso_pipeline/config.yaml (see the rationale there).
# WARNING, specific to this file: it runs valence_sq and time_sq, and those are
# the two cells where the 2026-07-28 ablation did NOT support the change.
# LOSO time_sq got worse without the filter (AUC 0.542 -> 0.485, i.e. below
# chance, with only 3/13 subjects improving); LOSO valence_sq was flat (-0.007).
# Systematically sub-chance AUC across folds is a sign of an overfitting mode
# the filter was masking, not of a better model. Treat time_sq output from this
# config as unreliable until it is re-run with permutations.
feature_selection_method: none
iforest_contamination: auto
iforest_n_estimators: 100
include_connectivity_pairs: false
k: 20
label_contrasts:
  ON_vs_OFF:
    label_source: onoff
    positive_above: true
    split_method: threshold
    threshold: 50
  ON_vs_OFF_within_median:
    confidence_weight:
      enabled: false
      normalization: within_subject
      w_min: 0.1
    gap: 5
    label_source: onoff
    positive_above: true
    split_method: within_subject_median
  confidence_within_median:
    gap: 5
    label_source: confidence
    negative_class_name: low-confidence
    positive_above: true
    positive_class_name: high-confidence
    split_method: within_subject_median
  selfother_within_median:
    gap: 5
    label_source: selfother
    negative_class_name: other
    positive_above: true
    positive_class_name: self
    split_method: within_subject_median
  time_sq:
    gap: 2.5
    label_source: time
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq
  time_sq_res:
    gap: 2.5
    label_source: time
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq_residual
  time_within_median:
    gap: 5
    label_source: time
    negative_class_name: past
    positive_above: true
    positive_class_name: future
    split_method: within_subject_median
  valence_sq:
    gap: 2.5
    label_source: valence
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq
  valence_sq_res:
    gap: 2.5
    label_source: valence
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq_residual
  valence_within_median:
    gap: 5
    label_source: valence
    negative_class_name: negative
    positive_above: true
    positive_class_name: positive
    split_method: within_subject_median
label_source: onoff
lmm_n_jobs: 2
lmm_prefilter_factor: 3
lr_C: 0.5
lr_class_weight: balanced
lr_l1_ratio: 0.1
lr_max_iter: 2000
lr_penalty: elasticnet
lr_solver: saga
min_minority_ratio: 0.2
min_samples: 10
model_type:
- rf
n_runs: 100
ocsvm_gamma: scale
ocsvm_kernel: rbf
ocsvm_nu: 0.1
oneclass_target: minority
oversampling_method: SMOTE
oversampling_scope: within
parallelism:
  n_perm_jobs: 1
  perm_cv_n_jobs: 4
  true_cv_n_jobs: 4
pca_kernel: rbf
pca_n_components: 20
pca_type: standard
permutation_runs: 500
permutation_scope: within
plot_style: seaborn-v0_8
preprocessing:
  imputation: mean
  max_feature_nan_frac: 0.25
  zero_fill_patterns:
