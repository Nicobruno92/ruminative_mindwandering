active_family: all
classifiers:
  iforest:
    contamination: auto
    n_estimators: 100
  lr:
    C: 1.0
    class_weight: balanced
    penalty: l2
    solver: lbfgs
  ocsvm:
    gamma: scale
    kernel: rbf
    nu: 0.1
  oneclass_target: minority
  rf:
    bootstrap: true
    class_weight: balanced_subsample
    max_depth: 8
    max_features: sqrt
    min_samples_leaf: 5
    min_samples_split: 10
    n_estimators: 200
  run_models:
  - rf
  xgb:
    learning_rate: 0.1
    max_depth: 3
    n_estimators: 100
    scale_pos_weight: auto
contrast: confidence_within_median
cv:
  folds: 5
  min_samples_per_class: 5
  strategy: stratified_kfold
data_format: per_roi
