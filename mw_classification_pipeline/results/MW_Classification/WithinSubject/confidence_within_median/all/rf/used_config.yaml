    - power_alpha
    - power_beta
    - power_gamma
    - power_normalized
feature_selection:
  k: 20
  lmm_n_jobs: 4
  lmm_prefilter_factor: 3
  method: none
include_connectivity_pairs: false
label_contrasts:
  confidence_within_median:
    column_name: confidence
    gap: 5
    negative_class_name: low-confidence
    positive_above: true
    positive_class_name: high-confidence
    split_method: within_subject_median
  on_vs_off_within_median:
    column_name: onoff
    gap: 5
    negative_class_name: OFF-task
    positive_above: true
    positive_class_name: ON-task
    split_method: within_subject_median
  selfother_within_median:
    column_name: selfother
    gap: 5
    negative_class_name: other
    positive_above: true
    positive_class_name: self
    split_method: within_subject_median
  time_sq:
    column_name: time
    gap: 2.5
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq
  time_sq_res:
    column_name: time
    gap: 2.5
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
