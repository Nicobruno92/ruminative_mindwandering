feature_selection_method: none
iforest_contamination: auto
iforest_n_estimators: 100
include_connectivity_pairs: false
k: 20
label_contrasts:
  ON_vs_OFF:
    label_source: onoff
    positive_above: true
    split_method: threshold
    threshold: 50
  ON_vs_OFF_within_median:
    confidence_weight:
      enabled: false
      normalization: within_subject
      w_min: 0.1
    gap: 5
    label_source: onoff
    positive_above: true
    split_method: within_subject_median
  confidence_within_median:
    gap: 5
    label_source: confidence
    negative_class_name: low-confidence
    positive_above: true
    positive_class_name: high-confidence
    split_method: within_subject_median
  selfother_within_median:
    gap: 5
    label_source: selfother
    negative_class_name: other
    positive_above: true
    positive_class_name: self
    split_method: within_subject_median
  time_sq:
    gap: 2.5
    label_source: time
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq
  time_sq_res:
    gap: 2.5
    label_source: time
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq_residual
  time_within_median:
    gap: 5
    label_source: time
    negative_class_name: past
    positive_above: true
    positive_class_name: future
    split_method: within_subject_median
  valence_sq:
    gap: 2.5
    label_source: valence
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq
  valence_sq_res:
    gap: 2.5
    label_source: valence
    negative_class_name: moderate
    positive_above: true
    positive_class_name: extreme
    split_method: within_subject_median
    transform: midpoint_sq_residual
  valence_within_median:
    gap: 5
    label_source: valence
    negative_class_name: negative
    positive_above: true
    positive_class_name: positive
    split_method: within_subject_median
