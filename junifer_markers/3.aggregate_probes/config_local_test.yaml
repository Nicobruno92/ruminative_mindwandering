# Configuration for Junifer marker aggregation by probe - LOCAL TEST
# This pipeline aggregates per-epoch markers into per-probe markers
# Similar to ERP probe aggregation but handles both evoked and state markers

project:
  # Root where derivatives are written by the preprocessing pipeline
  derivatives_root: "./test_data/derivatives"
  # BIDS root (optional, used by helpers that wrap BIDSCompliance)
  bids_root: "./test_data/BIDS"
  # Features root where junifer PKL files are located
  features_root: "./test_data/features"
  # Results root for figures/reports
  results_root: "results/junifer_markers"
  # Name of the preprocessed epochs derivative to load (for metadata and outlier detection)
  input_evoked_desc: "evoked"

# Subjects and tasks to process (can be overridden via CLI)
tasks: ["Sart1"]
subjects: ["02"]

# Trial selection parameters
trial_selection:
  only_go_correct: true
  # For evoked markers: use same range as ERP analysis
  evoked_distance_min: -5   # inclusive (e.g., -5)
  evoked_distance_max: -1   # inclusive (e.g., -1)
  # For state markers: aggregate all trials before probe
  state_distance_min: -999  # essentially all trials before probe
  state_distance_max: -1    # up to but not including probe response
  # Minimum number of distinct distances required within range
  min_required_distances: 3

# Probe labeling based on onoff rating embedded in event descriptions
labeling:
  onoff_threshold: 50   # on-task if onoff > 50, off-task if onoff <= 50

# Output parameters
output:
  desc_prefix: "probe"      # will generate desc like probe-015_onTask
  save_summary_csv: true     # save per-subject CSV summary of generated probes
  overwrite: true            # allow overwriting existing files

# Outlier detection thresholds (DISABLED - using trimmean only)
outlier_detection:
  # Outlier detection parameters (applied to epochs before aggregation)
  epoch_z_threshold: 3.0         # Z-score threshold for variance-based outlier detection (DISABLED)
  enable_outlier_detection: false # Set to false to disable outlier detection
  
  # Range of epochs for computing baseline statistics (mean/std) for outlier detection
  # Should be longer than the aggregation range to get more reliable statistics
  baseline_distance_min: -10     # inclusive (e.g., -10) - longer range for statistics
  baseline_distance_max: -1      # inclusive (e.g., -1)
  min_baseline_epochs: 5         # minimum epochs needed to compute reliable statistics
  
  # Trimmean parameters (alternative to outlier detection)
  trimmean_percent: 20           # Trim 20% from both ends (10% each side)

# Marker type definitions
marker_types:
  # Evoked markers: aggregate only trials closest to probe (like ERPs)
  # These are time-locked topographies
  evoked:
    - "P1"
    - "N1"
    - "P2"
    - "P3a"
    - "P3b"
  
  # State markers: aggregate all trials before probe
  # These are spectral, connectivity, and information theory markers
  state:
    # Spectral markers
    - "psd_bands"
    - "psd_relative"
    # Connectivity markers
    - "wsmi_theta"
    - "wsmi_alpha"
    - "wsmi_beta"
    - "wsmi_gamma"
    # Information theory markers
    - "PE_theta"
    - "PE_alpha"
    - "PE_beta"
    - "PE_gamma"
    - "kolmogorov_complexity"
