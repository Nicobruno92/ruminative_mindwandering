# Wandering Mind Evoked Epochs Pipeline - With Baseline Correction
# Processes evoked epochs (desc-evoked) which have baseline period [-0.2, 0]
# Supports sessions (a, b) and tasks (sartauditiva, sartvisual)
# Outputs features to BIDS-structured features directory

with:
  - junifer_eeg
workdir: .

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      # Pattern includes session: sub-XX/ses-X/eeg/sub-XX_ses-X_task-X_desc-X_epo.fif
      pattern: '{subject}/eeg/{subject}_task-{task}_desc-{desc}_epo.fif'
      space: native
  replacements: [subject, task, desc]
  types:
    - EEG
  # CYBERSART derivatives directory
  datadir: /network/iss/cenir/analyse/meeg/CYBERSART/BIDS/derivatives

datareader:
  kind: SARTDataReader
  preserve_annotations: true
  extract_behavioral_params: true
  channel_selection: eeg    # Keep only EEG channels, drop stimulus channels
  types:
    - EEG

storage:
  kind: HDF5FeatureStorage
  # With single_output: false, creates individual files per element
  # Pattern: element_{subject}_{session}_{task}_evoked_markers.h5
  uri: /network/iss/levy/analyze/valerocabre/analyse/nbruno/depressed_mindwandering/BIDS/features/junifer/markers.h5
  single_output: false
  
markers:
  # ========================================
  # 1. SPECTRAL ANALYSIS: Absolute Power (dB)
  # ========================================
  - kind: SpectralPower
    name: psd_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      gamma: [30.0, 45.0]
    normalize: false
    dB: true
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 2. SPECTRAL ANALYSIS: Relative Power (normalized)
  # ========================================
  - kind: SpectralPower
    name: psd_relative
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      gamma: [30.0, 45.0]
    normalize: true
    dB: false
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256 
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 4. CONNECTIVITY: Weighted Symbolic Mutual Information
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi_theta
    tmin:
    tmax:
    kernel: 3
    tau: 8
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_alpha
    tmin:
    tmax:
    kernel: 3
    tau: 4
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG

  - kind: SymbolicMutualInformation
    name: wsmi_beta
    tmin:
    tmax:
    kernel: 3
    tau: 2
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_gamma
    tmin:
    tmax:
    kernel: 3
    tau: 1
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 5. INFORMATION THEORY: Permutation Entropy
  # ========================================
  - kind: PermutationEntropy
    name: PE_theta
    kernel: 3
    tau: 8
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_alpha
    kernel: 3
    tau: 4
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_beta
    kernel: 3
    tau: 2
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_gamma
    kernel: 3
    tau: 1
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 6. INFORMATION THEORY: Kolmogorov Complexity
  # ========================================
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 7. TIME-LOCKED TOPOGRAPHIES: ERP Analysis
  # ========================================
  # Early components (P1, N1, P2)
  - kind: TimeLockedTopography
    name: P1
    tmin: 0.080
    tmax: 0.130
    baseline: [-0.2, 0]
    reference: ["TP9", "TP10"]
    # rois: ['O1', 'O2', 'P3', 'Pz', 'P4']
    trial_aggregation_method: null
    on: EEG

  - kind: TimeLockedTopography
    name: N1
    tmin: 0.140
    tmax: 0.200
    baseline: [-0.2, 0]
    reference: ["TP9", "TP10"]
    # rois: ['O1', 'O2', 'P3', 'Pz', 'P4']
    trial_aggregation_method: null
    on: EEG

  - kind: TimeLockedTopography
    name: P2
    tmin: 0.180
    tmax: 0.250
    baseline: [-0.2, 0]
    reference: ["TP9", "TP10"]
    # rois: ['P3', 'Pz', 'P4', 'CP1','CP2', 'Cz' ]
    trial_aggregation_method: null
    on: EEG
  
  # Late component (P3-like, ) 
  - kind: TimeLockedTopography
    name: P3a # Fronto-central, novelty-related
    tmin: 0.250
    tmax: 0.350
    baseline: [-0.2, 0]
    reference: ["TP9", "TP10"]
    # rois: ['FC1', 'FC2', 'F3', 'Fz', 'F4']
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  - kind: TimeLockedTopography
    name: P3b # anterior/central, attention-related
    tmin: 0.300
    tmax: 0.500
    baseline: [-0.2, 0]
    reference: ["TP9", "TP10"]
    # rois: ['P3', 'Pz', 'P4', 'CP1','CP2', 'Cz' ]
    trial_aggregation_method: null
    on: EEG

   # ========================================
  # PSD SUMMARY MARKERS (3 total: #12-14)
  # ========================================
  # Per-channel spectral summaries
  - kind: PowerSpectralDensitySummary
    name: msf
    percentile: 0.5
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_aggregation_method: null  # No ROI aggregation
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: sef90
    percentile: 0.9
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_aggregation_method: null
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: sef95
    percentile: 0.95
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_aggregation_method: null
    on: EEG
