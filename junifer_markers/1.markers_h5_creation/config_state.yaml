# Wandering Mind State Epochs Pipeline - No Baseline Correction
# Processes state epochs (desc-state) which start at t=0 without baseline period
# Supports sessions (a, b) and tasks (sartauditiva, sartvisual)
# Outputs features to BIDS-structured features directory

with:
  - junifer_eeg
  - sart_datagrabber_picnic
workdir: .

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: '{subject}/eeg/{subject}_task-{task}_desc-{desc}_epo.fif'
      space: native
  replacements: [subject, task, desc]
  types:
    - EEG
  # CYBERSART derivatives directory
  datadir: <PATH_TO_YOUR_BIDS_DERIVATIVES_ROOT>

datareader:
  kind: SARTDataReader
  preserve_annotations: true
  extract_behavioral_params: true
  channel_selection: eeg    # Keep only EEG channels, drop stimulus channels
  types:
    - EEG

storage:
  kind: HDF5FeatureStorage
  # With single_output: false, creates individual files per element
  # Pattern: element_{subject}_{task}_state_markers.h5
  uri: <PATH_TO_YOUR_BIDS_FEATURES_ROOT>/junifer/markers.h5
  single_output: false
  
markers:
  # ========================================
  # 1. SPECTRAL ANALYSIS: Absolute Power (dB)
  # ========================================
  - kind: SpectralPowerBands
    name: psd_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      iota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: false
    dB: true
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256
    trial_method: null
    on: EEG

  # ========================================
  # 2. SPECTRAL ANALYSIS: Relative Power (normalized)
  # ========================================
  - kind: SpectralPowerBands
    name: psd_relative
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      iota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: true
    dB: false
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256 
    trial_method: null
    on: EEG

  # ========================================
  # 4. CONNECTIVITY: Weighted Symbolic Mutual Information
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi_theta
    tmin:
    tmax:
    kernel: 3
    taus: [8]
    weighted: true
    csd: true
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_alpha
    tmin:
    tmax:
    kernel: 3
    taus: [4]
    weighted: true
    csd: true
    on: EEG

  - kind: SymbolicMutualInformation
    name: wsmi_beta
    tmin:
    tmax:
    kernel: 3
    taus: [2]
    weighted: true
    csd: true
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_gamma
    tmin:
    tmax:
    kernel: 3
    taus: [1]
    weighted: true
    csd: true
    on: EEG

  # ========================================
  # 5. INFORMATION THEORY: Permutation Entropy
  # ========================================
  - kind: PermutationEntropy
    name: PE_theta
    kernel: 3
    taus: [8]
    trial_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_alpha
    kernel: 3
    taus: [4]
    trial_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_beta
    kernel: 3
    taus: [2]
    trial_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_gamma
    kernel: 3
    taus: [1]
    trial_method: null
    on: EEG

  # ========================================
  # 6. INFORMATION THEORY: Kolmogorov Complexity
  # ========================================
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    trial_method: null
    on: EEG

   # ========================================
  # PSD SUMMARY MARKERS (3 total: #12-14)
  # ========================================
  # Per-channel spectral summaries
  - kind: PowerSpectralDensitySummary
    name: per_channel_msf
    percentile: 0.5
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null  # No ROI aggregation
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: per_channel_sef90
    percentile: 0.9
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: per_channel_sef95
    percentile: 0.95
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    on: EEG
