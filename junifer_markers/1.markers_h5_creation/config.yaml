# CYBERSART Final Pipeline - Advanced BIDS-compatible Processing
# Processes all subjects and sessions in BIDS derivatives directory
# Handles multiple sessions and flexible BIDS structure
# Outputs features to BIDS-structured features directory

with:
  - junifer_eeg
workdir: .

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: '{subject}/eeg/{subject}_task-{task}_desc-{desc}_epo.fif'
      space: native
  replacements: [subject, task, desc]
  types:
    - EEG
  # Use the base derivatives directory to find all combinations
  datadir: /network/iss/cenir/analyse/meeg/CYBERSART/BIDS/derivatives

datareader:
  kind: SARTDataReader
  preserve_annotations: true
  extract_behavioral_params: true
  channel_selection: eeg    # Keep only EEG channels, drop stimulus channels
  types:
    - EEG

storage:
  kind: HDF5FeatureStorage
  # With single_output: false, creates individual files per element
  # Pattern: element_{subject}_{task}_{desc}_markers.h5
  uri: /network/iss/cenir/analyse/meeg/CYBERSART/BIDS/features/junifer/markers.h5
  single_output: false
  
markers:
  # ========================================
  # 1. SPECTRAL ANALYSIS: Absolute Power (dB)
  # ========================================
  - kind: SpectralPower
    name: psd_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      jota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: false
    dB: true
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256 
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  # ========================================
  # 2. SPECTRAL ANALYSIS: Relative Power (normalized)
  # ========================================
  - kind: SpectralPower
    name: psd_relative
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      jota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: true
    dB: false
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256 
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  # ========================================
  # 4. CONNECTIVITY: Weighted Symbolic Mutual Information
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi_theta
    tmin:
    tmax:
    kernel: 3
    tau: 8
    weighted: true
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_alpha
    tmin:
    tmax:
    kernel: 3
    tau: 4
    weighted: true
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: SymbolicMutualInformation
    name: wsmi_beta
    tmin:
    tmax:
    kernel: 3
    tau: 2
    weighted: true
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_gamma
    tmin:
    tmax:
    kernel: 3
    tau: 1
    weighted: true
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  # ========================================
  # 5. INFORMATION THEORY: Permutation Entropy
  # ========================================
  - kind: PermutationEntropy
    name: PE_theta
    kernel: 3
    tau: 8
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: PermutationEntropy
    name: PE_alpha
    kernel: 3
    tau: 4
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: PermutationEntropy
    name: PE_beta
    kernel: 3
    tau: 2
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: PermutationEntropy
    name: PE_gamma
    kernel: 3
    tau: 1
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  # ========================================
  # 6. INFORMATION THEORY: Kolmogorov Complexity
  # ========================================
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  # ========================================
  # 7. TIME-LOCKED TOPOGRAPHIES: ERP Analysis
  # ========================================
  # Early components (P1, N1, P2)
  - kind: TimeLockedTopography
    name: P1
    tmin: 0.080
    tmax: 0.130
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: TimeLockedTopography
    name: N1
    tmin: 0.140
    tmax: 0.200
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: TimeLockedTopography
    name: P2
    tmin: 0.180
    tmax: 0.250
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG
  
  # Late component (P3-like, ) 
  - kind: TimeLockedTopography
    name: P3a # Fronto-central, novelty-related
    tmin: 0.250
    tmax: 0.350
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG

  - kind: TimeLockedTopography
    name: P3b # anterior/central, attention-related
    tmin: 0.300
    tmax: 0.500
    roi_aggregation_method:
    trial_aggregation_method:
    on: EEG
