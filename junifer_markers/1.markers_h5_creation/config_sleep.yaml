# Wandering Mind Sleep Epochs Pipeline - No Baseline Correction
# Processes sleep epochs (desc-sleep) which are long pre-probe epochs (20s before probe)
# Supports sessions (a, b) and tasks (sartauditiva, sartvisual)
# Outputs features to BIDS-structured features directory

with:
  - junifer_eeg
workdir: .

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      # Pattern includes session: sub-XX/ses-X/eeg/sub-XX_ses-X_task-X_desc-X_epo.fif
      pattern: '{subject}/eeg/{subject}_task-{task}_desc-{desc}_epo.fif'
      space: native
  replacements: [subject, task, desc]
  types:
    - EEG
  # CYBERSART derivatives directory
  datadir: /network/iss/cenir/analyse/meeg/CYBERSART/BIDS/derivatives

datareader:
  kind: SARTDataReader
  preserve_annotations: true
  extract_behavioral_params: true
  channel_selection: eeg    # Keep only EEG channels, drop stimulus channels
  types:
    - EEG

storage:
  kind: HDF5FeatureStorage
  # With single_output: false, creates individual files per element
  # Pattern: element_{subject}_{session}_{task}_sleep_markers.h5
  uri: /network/iss/levy/analyze/valerocabre/analyse/nbruno/depressed_mindwandering/BIDS/features/junifer/markers.h5
  single_output: false
  
markers:
  # ========================================
  # 1. SPECTRAL ANALYSIS: Absolute Power (dB)
  # ========================================
  - kind: SpectralPower
    name: psd_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      iota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: false
    dB: true
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 2. SPECTRAL ANALYSIS: Relative Power (normalized)
  # ========================================
  - kind: SpectralPower
    name: psd_relative
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 25.0]
      iota: [25.0, 35.0]
      gamma: [35.0, 45.0]
    normalize: true
    dB: false
    n_fft: 1024
    n_per_seg: 512
    n_overlap: 256 
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 4. CONNECTIVITY: Weighted Symbolic Mutual Information
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi_theta
    tmin:
    tmax:
    kernel: 3
    tau: 8
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_alpha
    tmin:
    tmax:
    kernel: 3
    tau: 4
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG

  - kind: SymbolicMutualInformation
    name: wsmi_beta
    tmin:
    tmax:
    kernel: 3
    tau: 2
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_gamma
    tmin:
    tmax:
    kernel: 3
    tau: 1
    weighted: true
    csd: true
    connectivity_aggregation_method: "median"
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 4.b CONNECTIVITY: Non-Aggregated (Pairs)
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi_theta_pairs
    tmin:
    tmax:
    kernel: 3
    tau: 8
    weighted: true
    csd: true
    connectivity_aggregation_method: null
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_alpha_pairs
    tmin:
    tmax:
    kernel: 3
    tau: 4
    weighted: true
    csd: true
    connectivity_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  - kind: SymbolicMutualInformation
    name: wsmi_beta_pairs
    tmin:
    tmax:
    kernel: 3
    tau: 2
    weighted: true
    csd: true
    connectivity_aggregation_method: null
    trial_aggregation_method: null
    on: EEG
  
  - kind: SymbolicMutualInformation
    name: wsmi_gamma_pairs
    tmin:
    tmax:
    kernel: 3
    tau: 1
    weighted: true
    csd: true
    connectivity_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 5. INFORMATION THEORY: Permutation Entropy
  # ========================================
  - kind: PermutationEntropy
    name: PE_theta
    kernel: 3
    tau: 8
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_alpha
    kernel: 3
    tau: 4
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_beta
    kernel: 3
    tau: 2
    trial_aggregation_method: null
    on: EEG

  - kind: PermutationEntropy
    name: PE_gamma
    kernel: 3
    tau: 1
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 6. INFORMATION THEORY: Kolmogorov Complexity
  # ========================================
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 7. SLEEP SPECIFIC: Slow Waves & Spindles
  # ========================================
  - kind: SlowWavesDetection
    name: slowwaves
    method: "custom"
    freq_threshold: 7.0
    artifact_threshold: 75.0
    ptp_threshold_mode: "adaptive"
    ptp_percentile: 90.0
    max_ptp_amplitude: 150.0
    reference: ["TP9", "TP10"]
    # No aggregation: returns (features, epochs, channels)
    channel_aggregation_method: null
    epoch_aggregation_method: null
    on: EEG

  - kind: SpindlesDetection
    name: spindles
    freq_sp: [12, 15]
    freq_broad: [1, 30]
    duration: [0.5, 2.5]
    min_distance: 500
    thresh_rms: 1.5
    thresh_corr: 0.65
    reference: ["TP9", "TP10"]
    # No aggregation: returns (features, epochs, channels)
    channel_aggregation_method: null
    epoch_aggregation_method: null
    on: EEG
