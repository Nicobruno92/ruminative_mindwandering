project:
  # Root where derivatives are written by the preprocessing pipeline
  derivatives_root: "/Volumes/cenir/analyse/meeg/CYBERSART/BIDS/derivatives"
  # BIDS root (optional, used by helpers that wrap BIDSCompliance)
  bids_root: "/Volumes/cenir/analyse/meeg/CYBERSART/BIDS"
  # Features root where this ERP pipeline will save outputs
  features_root: "/Volumes/cenir/analyse/meeg/CYBERSART/BIDS/features"
  # Results root for figures/reports (subject and group outputs)
  results_root: "results/ERPs_new"
  # Name of the preoprocessed epochs derivative to load (from preprocessing)
  input_evoked_desc: "evoked"

# Subjects and tasks to process (can be overridden via CLI)  
tasks: ["Sart1", "Sart2", "Sart3", 'Sart4']
subjects: ["02", "03", "04", "05"]  # Reduced list for testing

# Trial selection parameters
trial_selection:
  only_go_correct: true
  distance_min: -5   # inclusive (e.g., -5)
  distance_max: -1   # inclusive (e.g., -1)
  # Minimum number of distinct distances required within [distance_min, distance_max]
  # Example: 5 means require all {-5,-4,-3,-2,-1} if that range is [-5,-1];
  # 3 means accept any probe that has at least 3 distinct distances in range.
  # Set to 0 to disable the requirement.
  min_required_distances: 3

# Probe labeling based on onoff rating embedded in event descriptions
labeling:
  onoff_threshold: 50   # on-task if onoff > 50, off-task if onoff < 50; 50 is ignored

# Output parameters
output:
  desc_prefix: "probe"      # will generate desc like probe-015_onTask
  save_summary_csv: true     # save per-subject CSV summary of generated probes
  overwrite: true            # allow overwriting existing evoked files

# Optional: evoked writing options
evoked:
  # Whether to apply additional baseline before averaging (epochs may already be baselined)
  apply_baseline: true
  baseline: [Null, Null] #[-0.2, 0.0]

# ERP ROI definitions (channel names; extend/modify per montage)
erp_rois:
  frontal: ["AFz", "Fz", "FCz", "F1", "F2"]
  central: ["FCz", "Cz", "CPz", "C1", "C2"]
  posterior: ["CPz", "Pz","POz", "P1", "P2"]

# Outlier detection parameters
outlier_detection:
  # Remove epochs with extreme amplitude values (z-score threshold)
  epoch_z_threshold: 3.0     # Remove epochs with |z-score| > 3.0
  # Remove subjects with too few good epochs
  min_epochs_per_subject: 20 # Require at least 20 good epochs per subject-condition

# LMM Analysis configuration
lmm_analysis:
  enabled: true
  formula: "amplitude ~ condition_code + baseline_centered"  # Basic LMM formula
  # Alternative formulas:
  # "amplitude ~ condition_code"                              # Simple condition comparison
  # "amplitude ~ condition_code + baseline_centered + I(baseline_centered**2)"  # Quadratic baseline
  
  time_windows:
    # Time windows for LMM analysis (in seconds)
    p1: [0.08, 0.15]       # P1 window
    p200: [0.15, 0.25]        # P2/N2 window  
    p300: [0.25, 0.40]        # P3 window
    P3b: [0.40, 0.60]        # Late positive component
  window_step: 0.05           # Step size for sliding windows (50ms)
  baseline_window: [-0.2, 0.0]  # Baseline for amplitude calculation
  min_epochs_per_subject: 0   # Minimum epochs required per subject-condition
  alpha_level: 0.05           # Significance level for statistical tests
  
  # Advanced temporal analysis with Unfold.jl
  use_julia: true
  use_unfold: true           # Set to true to use Unfold.jl for temporal LMM analysis

# Multiple comparison correction for temporal LMM analysis
multiple_comparison_correction:
  # Method for correcting multiple comparisons across time points
  # Options: 'none', 'fdr', 'bonferroni', 'cluster_permutation'
  method: "cluster_permutation"  # Recommended for temporal data
  
  # Cluster permutation testing parameters
  cluster_permutation:
    n_permutations: 1000      # Number of permutations (1000 for testing, 5000 for final)
    threshold: "auto"         # 'auto' or numeric value
    tail: 0                   # 0=two-tailed, 1=right, -1=left
    n_jobs: -1                # Use all CPUs
    seed: 42                  # For reproducibility
  
# Plotting options
plotting:
  # Available plot types:
  # 'classic_erp': Traditional ERP averages (option A) - shows raw signal without baseline subtraction
  # 'beta_timecourse': Time-course of LMM betas (option B) - shows statistical effects over time
  # 'both': Generate both types of plots
  plot_type: "both"           # Options: "classic_erp", "beta_timecourse", "both"
  
  # For beta time-course plots
  time_step: 0.01             # Time step for sliding window LMM (10ms)
  window_width: 0.05          # Width of sliding window (50ms)
  smooth_betas: true          # Apply smoothing to beta time-course
  smoothing_window: 0.02      # Smoothing window width (20ms)
  
  # Combined ERP + Beta plotting
  create_combined_erp_beta: true  # Create combined ERP waveform + beta time-course plots
                                  # Shows traditional ERPs alongside statistical effects