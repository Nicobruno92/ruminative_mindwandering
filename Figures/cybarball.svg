<svg viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #7f8c8d; font-style: italic; }
      .condition-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 32px; font-weight: bold; }
      .condition-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #5a6c7d; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #34495e; font-weight: 600; }
      .step-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #7f8c8d; font-weight: 600; }
      .info-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5a6c7d; }
      .key-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      
      .inclusion-color { fill: #27ae60; }
      .exclusion-color { fill: #e74c3c; }
      
      .arrow-inclusion { stroke: #27ae60; stroke-width: 4; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-exclusion { stroke: #e74c3c; stroke-width: 4; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-double { stroke: #e74c3c; stroke-width: 4; fill: none; }
      
      .stick-figure { stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#27ae60" />
    </marker>
    <marker id="arrowhead-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c" />
    </marker>
    
    <!-- Participant stick figure (orange) - pose 1 -->
    <g id="participant-1">
      <!-- Head -->
      <circle cx="0" cy="-25" r="8" fill="none" stroke="#e67e22" class="stick-figure"/>
      <!-- Eyes -->
      <circle cx="-2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <circle cx="2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <!-- Mouth -->
      <path d="M -3,-23 Q 0,-21 3,-23" stroke="#e67e22" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <line x1="0" y1="-17" x2="0" y2="5" stroke="#e67e22" class="stick-figure"/>
      <!-- Arms - reaching out -->
      <path d="M 0,-12 Q -8,-10 -12,-8" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,-12 Q 8,-10 12,-8" stroke="#e67e22" class="stick-figure"/>
      <!-- Legs -->
      <path d="M 0,5 L -6,18" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,5 L 6,18" stroke="#e67e22" class="stick-figure"/>
    </g>
    
    <!-- Participant stick figure (orange) - pose 2 (receiving) -->
    <g id="participant-2">
      <!-- Head -->
      <circle cx="0" cy="-25" r="8" fill="none" stroke="#e67e22" class="stick-figure"/>
      <!-- Eyes -->
      <circle cx="-2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <circle cx="2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <!-- Mouth -->
      <path d="M -3,-23 Q 0,-21 3,-23" stroke="#e67e22" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <line x1="0" y1="-17" x2="0" y2="5" stroke="#e67e22" class="stick-figure"/>
      <!-- Arms - raised up -->
      <path d="M 0,-12 Q -6,-16 -8,-20" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,-12 Q 6,-16 8,-20" stroke="#e67e22" class="stick-figure"/>
      <!-- Legs -->
      <path d="M 0,5 L -5,18" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,5 L 5,18" stroke="#e67e22" class="stick-figure"/>
    </g>
    
    <!-- Participant stick figure (orange) - pose 3 (sad/excluded) -->
    <g id="participant-sad">
      <!-- Head -->
      <circle cx="0" cy="-25" r="8" fill="none" stroke="#e67e22" class="stick-figure"/>
      <!-- Eyes (sad) -->
      <circle cx="-2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <circle cx="2.5" cy="-26" r="1.5" fill="#e67e22"/>
      <!-- Mouth (sad) -->
      <path d="M -3,-21 Q 0,-19 3,-21" stroke="#e67e22" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <line x1="0" y1="-17" x2="0" y2="5" stroke="#e67e22" class="stick-figure"/>
      <!-- Arms - down/dejected -->
      <path d="M 0,-12 Q -4,-6 -5,2" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,-12 Q 4,-6 5,2" stroke="#e67e22" class="stick-figure"/>
      <!-- Legs -->
      <path d="M 0,5 L -4,18" stroke="#e67e22" class="stick-figure"/>
      <path d="M 0,5 L 4,18" stroke="#e67e22" class="stick-figure"/>
    </g>
    
    <!-- Confederate stick figure (blue) - pose 1 -->
    <g id="confederate-1">
      <!-- Head -->
      <circle cx="0" cy="-25" r="8" fill="none" stroke="#2980b9" class="stick-figure"/>
      <!-- Eyes -->
      <circle cx="-2.5" cy="-26" r="1.5" fill="#2980b9"/>
      <circle cx="2.5" cy="-26" r="1.5" fill="#2980b9"/>
      <!-- Mouth -->
      <path d="M -3,-23 Q 0,-21 3,-23" stroke="#2980b9" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <line x1="0" y1="-17" x2="0" y2="5" stroke="#2980b9" class="stick-figure"/>
      <!-- Arms -->
      <path d="M 0,-12 Q -7,-8 -10,-5" stroke="#2980b9" class="stick-figure"/>
      <path d="M 0,-12 Q 7,-8 10,-5" stroke="#2980b9" class="stick-figure"/>
      <!-- Legs -->
      <path d="M 0,5 L -6,18" stroke="#2980b9" class="stick-figure"/>
      <path d="M 0,5 L 6,18" stroke="#2980b9" class="stick-figure"/>
    </g>
    
    <!-- Confederate stick figure (blue) - pose 2 -->
    <g id="confederate-2">
      <!-- Head -->
      <circle cx="0" cy="-25" r="8" fill="none" stroke="#2980b9" class="stick-figure"/>
      <!-- Eyes -->
      <circle cx="-2.5" cy="-26" r="1.5" fill="#2980b9"/>
      <circle cx="2.5" cy="-26" r="1.5" fill="#2980b9"/>
      <!-- Mouth -->
      <path d="M -3,-23 Q 0,-21 3,-23" stroke="#2980b9" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <line x1="0" y1="-17" x2="0" y2="5" stroke="#2980b9" class="stick-figure"/>
      <!-- Arms - one up, one down -->
      <path d="M 0,-12 Q -6,-14 -9,-18" stroke="#2980b9" class="stick-figure"/>
      <path d="M 0,-12 Q 7,-6 10,-2" stroke="#2980b9" class="stick-figure"/>
      <!-- Legs -->
      <path d="M 0,5 L -5,18" stroke="#2980b9" class="stick-figure"/>
      <path d="M 0,5 L 7,18" stroke="#2980b9" class="stick-figure"/>
    </g>
    
    <!-- Ball -->
    <g id="ball">
      <circle cx="0" cy="0" r="7" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
      <path d="M -5,-2 Q 0,-4 5,-2" stroke="#95a5a6" stroke-width="1.5" fill="none"/>
      <path d="M -5,2 Q 0,4 5,2" stroke="#95a5a6" stroke-width="1.5" fill="none"/>
    </g>
  </defs>
  
  <!-- Header -->
  <text x="700" y="55" text-anchor="middle" class="title">Paradigme Cyberball</text>
  <text x="700" y="85" text-anchor="middle" class="subtitle">Jeu virtuel d'échange de balle mesurant l'exclusion sociale</text>
  
  <!-- Context box -->
  <rect x="200" y="100" width="1000" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
  <text x="700" y="125" text-anchor="middle" class="info-text">Le participant croit jouer avec 2 autres participants dans des pièces séparées.</text>
  <text x="700" y="145" text-anchor="middle" class="info-text">En réalité, les autres "participants" sont contrôlés par ordinateur.</text>
  <text x="700" y="165" text-anchor="middle" class="info-text" font-weight="bold">Chaque condition = 30 lancers de balle</text>
  
  <line x1="100" y1="190" x2="1300" y2="190" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- INCLUSION CONDITION -->
  <g id="inclusion-section">
    <rect x="80" y="210" width="620" height="280" fill="#e8f8f5" stroke="#27ae60" stroke-width="3" rx="12" opacity="0.3"/>
    
    <text x="100" y="245" class="condition-title inclusion-color">Condition Inclusion</text>
    <text x="100" y="270" class="condition-desc">Le participant reçoit ~1/3 des passes (10/30), bien réparties</text>
    
    <!-- Toss 1 -->
    <g transform="translate(180, 360)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#27ae60" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancer 1</text>
      
      <use href="#participant-1" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-1" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-2" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="-8" y="5"/>
      <path d="M 0,5 L 25,-5" class="arrow-inclusion"/>
    </g>
    
    <!-- Toss 2 -->
    <g transform="translate(390, 360)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#27ae60" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancer 2</text>
      
      <use href="#participant-2" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-2" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-1" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="25" y="-10"/>
      <path d="M 20,-8 L -25,10" class="arrow-inclusion"/>
    </g>
    
    <!-- Toss 3 -->
    <g transform="translate(600, 360)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#27ae60" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancer 3</text>
      
      <use href="#participant-1" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-1" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-2" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="-8" y="15"/>
      <path d="M 0,18 L 25,45" class="arrow-inclusion"/>
    </g>
    
    <text x="650" y="390" class="step-label" font-size="32" fill="#27ae60">...</text>
  </g>
  
  <!-- EXCLUSION CONDITION -->
  <g id="exclusion-section">
    <rect x="80" y="510" width="820" height="280" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="12" opacity="0.3"/>
    
    <text x="100" y="545" class="condition-title exclusion-color">Condition Exclusion</text>
    <text x="100" y="570" class="condition-desc">Le participant reçoit 2 passes au début, puis plus aucune (2/30)</text>
    
    <!-- Toss 1 -->
    <g transform="translate(180, 660)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#e74c3c" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancer 1</text>
      
      <use href="#participant-1" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-1" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-2" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="-8" y="5"/>
      <path d="M 0,5 L 25,-5" class="arrow-exclusion"/>
    </g>
    
    <!-- Toss 2 -->
    <g transform="translate(390, 660)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#e74c3c" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancer 2</text>
      
      <use href="#participant-2" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-2" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-1" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="25" y="-10"/>
      <path d="M 20,-8 L -25,10" class="arrow-exclusion"/>
    </g>
    
    <!-- Toss 3+ (exclusion begins) -->
    <g transform="translate(600, 660)">
      <rect x="-70" y="-70" width="140" height="150" fill="white" stroke="#e74c3c" stroke-width="2" rx="8"/>
      <text x="0" y="-78" text-anchor="middle" class="step-label">Lancers 3-30</text>
      
      <use href="#participant-sad" x="-40" y="20"/>
      <text x="-40" y="50" text-anchor="middle" class="label" font-size="11">VOUS</text>
      
      <use href="#confederate-2" x="40" y="-10"/>
      <text x="40" y="20" text-anchor="middle" class="label" font-size="10">Joueur 2</text>
      
      <use href="#confederate-1" x="40" y="50"/>
      <text x="40" y="80" text-anchor="middle" class="label" font-size="10">Joueur 3</text>
      
      <use href="#ball" x="40" y="20"/>
      
      <!-- Double arrow between confederates -->
      <path d="M 40,-5 L 40,45" class="arrow-double"/>
      <polygon points="40,-5 37,-10 43,-10" fill="#e74c3c"/>
      <polygon points="40,45 37,50 43,50" fill="#e74c3c"/>
    </g>
    
    <!-- No more passes indicator -->
    <g transform="translate(760, 660)">
      <text x="0" y="0" font-size="48" fill="#e74c3c" opacity="0.6">✗</text>
      <text x="0" y="30" text-anchor="middle" class="condition-desc" font-size="14" fill="#e74c3c">Aucune passe</text>
      <text x="0" y="48" text-anchor="middle" class="condition-desc" font-size="14" fill="#e74c3c">pour VOUS</text>
    </g>
  </g>
  
  <!-- Key/Legend -->
  <g id="legend">
    <rect x="940" y="210" width="340" height="280" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10"/>
    <text x="1110" y="245" text-anchor="middle" class="key-title">LÉGENDE</text>
    <line x1="960" y1="255" x2="1260" y2="255" stroke="#dee2e6" stroke-width="2"/>
    
    <!-- Participant -->
    <use href="#participant-1" x="1010" y="295"/>
    <rect x="980" y="255" width="80" height="60" fill="none" stroke="#e67e22" stroke-width="1.5" rx="5" stroke-dasharray="3,3"/>
    <text x="1075" y="290" class="label" font-size="15">Participant</text>
    <text x="1075" y="305" class="info-text" font-size="12">(vous)</text>
    
    <!-- Confederate -->
    <use href="#confederate-1" x="1010" y="365"/>
    <rect x="980" y="325" width="80" height="60" fill="none" stroke="#2980b9" stroke-width="1.5" rx="5" stroke-dasharray="3,3"/>
    <text x="1075" y="357" class="label" font-size="15">Confédéré</text>
    <text x="1075" y="372" class="info-text" font-size="12">(ordinateur)</text>
    
    <!-- Ball -->
    <use href="#ball" x="1000" y="415"/>
    <text x="1020" y="420" class="label" font-size="15">Balle</text>
    
    <!-- Arrow -->
    <line x1="970" y1="450" x2="1030" y2="450" stroke="#27ae60" stroke-width="4" marker-end="url(#arrowhead-green)"/>
    <text x="1050" y="455" class="label" font-size="15">Passe de balle</text>
    
    <!-- Info box -->
    <rect x="960" y="470" width="290" height="20" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="4"/>
    <text x="1105" y="484" text-anchor="middle" class="info-text" font-size="11" font-weight="bold" fill="#856404">⚠ Les confédérés sont contrôlés par l'ordinateur</text>
  </g>
</svg>