clustering:
  alpha: 0.05
  exclude_channels:
    auto_percentile: 10
    channel_names:
    - FT9
    - TP9
    - FT10
    - TP10
    - F7
    - F8
    - T7
    - T8
    - P7
    - P8
    - Iz
    enabled: true
    method: manual
  method: threshold
  n_jobs: 1
  n_permutations: 100
  permutation_method: freedman_lane
  seed: 42
  stat_fun: sum
  t_power: 1.0
  tail: 0
  tfce:
    E: 0.5
    H: 2.0
    n_steps: 500
  threshold: 2.5
feature_families:
  state_test:
  - EEG_psd_bands_spectralpower_alpha
lmm:
  formula: power ~ onoff + (1|subject)
  maxiter: 2000
  method: powell
  predictor_of_interest: onoff
  random_state: 42
multiple_comparisons:
  alpha: 0.05
  evoked: fdr_bh
  state: fdr_bh
output:
